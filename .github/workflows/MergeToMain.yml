name: Merge Pull Requests into 'main'

on:
  push:
    branches: [main]

permissions:
  packages: write

env:
  DOTNET_NOLOGO: true

jobs:
  build_and_create_a_nuget:
    name: Build and create a BETA NuGet package (GPR)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build version prefix/suffix
        run: |
          echo "VERSION_PREFIX=${{ github.run_number }}.0.0" >> $GITHUB_ENV
          echo "VERSION_SUFFIX=beta.${{ github.run_attempt }}" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - run: dotnet restore --verbosity minimal

      - run: dotnet build --configuration Release -p:ContinuousIntegrationBuild=true -p:VersionPrefix=$VERSION_PREFIX --version-suffix $VERSION_SUFFIX

      - name: Run unit tests
        run: dotnet test tests/UnitTests/ --configuration Release --no-build --verbosity minimal

      - name: Pack NuGet (library only)
        run: dotnet pack src/Serilog.Sinks.InsightIDR/Serilog.Sinks.InsightIDR.csproj --configuration Release --no-build --output ./artifacts -p:VersionPrefix=$VERSION_PREFIX --version-suffix $VERSION_SUFFIX -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      - name: Publish artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NuGetPackage.${{ env.VERSION_PREFIX }}-${{ env.VERSION_SUFFIX }}.nupkg.zip
          path: ./artifacts/*

      - name: Publish to GPR
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --no-symbols \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}
